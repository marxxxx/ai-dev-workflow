# Run-only template: copy into a consuming project; build images separately.
services:
  ai-dev-workflow:
    image: ${AGENT_IMAGE:-ai-dev-workflow}
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root setup remaps dev and owns its home, then drops privileges.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      PROJECT_ROOT: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - type: bind
        source: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: agent-home
        target: /home/dev
      # Container-only dependency trees. Each entry masks the host directory below it,
      # so the host install stays intact and Linux binaries never reach it. Add one per
      # node_modules of your project, and declare the volume at the bottom of this file.
      # - type: volume
      #   source: deps-apps-web
      #   target: /workspace/apps/web/node_modules
    command: ["bash"]

volumes:
  agent-home:
  # deps-apps-web:
