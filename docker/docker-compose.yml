# Run-only template: copy into a consuming project; build images separately.
services:
  ai-dev-workflow:
    image: ${AGENT_IMAGE:-ai-dev-workflow}
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root setup remaps dev and owns its home, then drops privileges.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      PROJECT_ROOT: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
    volumes:
      - type: bind
        source: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: agent-home
        target: /home/dev
    command: ["bash"]

volumes:
  agent-home:
