name: CI

# Validation gate for pull requests. Mark the "test" job as a required
# status check in the branch protection rules for `main` so PRs cannot
# merge until the full test suite passes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run full test suite
        run: npm test

      - name: Verify generation is deterministic
        # Generated files (.claude/.codex/.opencode) are gitignored, so a fresh
        # checkout has none — bare `check` would report drift and fail. Generate
        # first, then check: this proves the generator is idempotent (no
        # non-deterministic output) rather than diffing against committed files.
        run: |
          npm run generate
          npm run check

  container:
    name: Container runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Builds and verifies on every run; publishes to Docker Hub only from main.
    # Needs the DOCKERHUB_TOKEN secret (Read & Write access token); the username
    # and repository can be overridden with repository variables.
    concurrency:
      group: container-${{ github.ref }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'marxx' }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'marxx/ai-dev-workflow' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install container test dependencies
        run: npm ci --prefix docker/tools --ignore-scripts
      - name: Check tool pins against the inventory
        run: node docker/tools/inventory.mjs check
      - name: Select image tag
        run: echo "IMAGE_TAG=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
      - name: Build reusable tool images
        run: node docker/build.mjs --tag "$IMAGE_TAG"
      - name: Verify offline tools and isolated runtime
        run: bash docker/verify-runtime.sh
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push images to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node docker/build.mjs push --tag "$IMAGE_TAG" --repository "$DOCKERHUB_REPOSITORY"
