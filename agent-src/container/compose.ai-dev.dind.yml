# Project-owned; written once by ai-dev-workflow init. Opt-in overlay: a Docker daemon for the
# agent (image builds, docker compose, Testcontainers). The launchers add it when .env.ai-dev sets
# AGENT_DIND=1 (see AI-DEV.md). `run --rm` leaves the daemon running; stop it with
# `docker compose -p @@SLUG@@-ai down`.
#
# SECURITY: the daemon runs in a privileged, rootful sidecar. Whoever can reach its socket - every
# agent in the container - can become root on the host (Linux) or in the Docker Desktop VM, which
# reaches the host drives (Windows). Use it only where that is acceptable. Rootless dind is not an
# option: Ubuntu 23.10+ hosts block it by default (apparmor_restrict_unprivileged_userns).
#
# The agent shares the daemon's network namespace, so ports published by nested containers
# (docker run -p, compose ports:, Testcontainers) answer on localhost. Publish ports to the host
# on the `docker` service; `ports:` on ai-dev-workflow conflicts with network_mode.
services:
  docker:
    image: docker:29-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
    privileged: true
    # Unix socket only, owned by the runtime group; no TCP listener.
    command: ["dockerd", "--host=unix:///run/dind/docker.sock", "--group=${HOST_GID:-1000}"]
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      # Same project at the same path: relative and /workspace bind mounts of nested containers
      # resolve to the project. Absolute paths elsewhere (/var/...) stay inside this container.
      - type: bind
        source: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: docker-data
        target: /var/lib/docker
      - type: volume
        source: docker-socket
        target: /run/dind
    healthcheck:
      test: ["CMD", "docker", "--host", "unix:///run/dind/docker.sock", "info"]
      interval: 2s
      timeout: 5s
      retries: 60

  ai-dev-workflow:
    network_mode: service:docker
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///run/dind/docker.sock
      # Ryuk mounts the socket by its path inside the daemon's container; mapped ports are local.
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/dind/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: localhost
    volumes:
      - type: volume
        source: docker-socket
        target: /run/dind

volumes:
  # Images, build cache and nested volumes; `down --volumes` deletes them.
  docker-data:
  docker-socket:
