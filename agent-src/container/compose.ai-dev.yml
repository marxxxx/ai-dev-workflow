# Project-owned; written once by ai-dev-workflow init. Start it with ./ai-dev.sh or .\ai-dev.ps1
# (see AI-DEV.md). Add services, ports and dependency volumes as your project needs; keep the
# /workspace bind, agent-home, the capability set and the HOST_UID/HOST_GID settings.
name: @@SLUG@@-ai
services:
  ai-dev-workflow:
    image: ${AGENT_IMAGE:-@@IMAGE@@}
    working_dir: /workspace
    init: true
    stdin_open: true
    tty: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root setup remaps dev and owns its home, then drops privileges. KILL lets the root init
    # (tini) forward signals such as SIGWINCH to dev's processes; without it tini exits.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETUID
      - SETGID
    environment:
      PROJECT_ROOT: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - type: bind
        source: ${PROJECT_ROOT:?Set PROJECT_ROOT to an existing absolute project directory}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: agent-home
        target: /home/dev
@@NODE_MOUNT@@
      # Container-only dependency trees. Each entry masks the host directory below it,
      # so the host install stays intact and Linux binaries never reach it. Add one per
      # node_modules of your project, and declare the volume at the bottom of this file.
      # - type: volume
      #   source: deps-apps-web
      #   target: /workspace/apps/web/node_modules
    command: ["bash"]

volumes:
  agent-home:
@@NODE_VOLUME@@
  # deps-apps-web:
